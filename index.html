<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DEC Épreuve 2</title>
  <meta name="description" content="Préparation de l'épreuve 2 du DEC (révision légale et contractuelle des comptes) : parcours jour par jour, chrono à jalons, index de documentation, récitation, statistiques des annales. Hors ligne.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DEC UE2">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/ue2-touch-180.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>try { var t = localStorage.getItem('dec2.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="top">
    <div><div class="eyebrow">DEC · Révision légale et contractuelle</div><h1>Épreuve 2</h1></div>
    <div class="row" style="gap:4px;flex-wrap:nowrap"><span id="count" class="countdown"></span><button class="iconbtn" id="settingsBtn" aria-label="Réglages"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
  </header>
  <div class="ptr" id="ptr" aria-hidden="true"><span></span></div>
  <main id="main"><div class="card">Chargement…</div></main>
  <nav class="bottom"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden></div>
  <script>
    setTimeout(function () {
      var m = document.getElementById('main');
      if (!m || m.textContent.trim() !== 'Chargement…' || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
      try { if (sessionStorage.getItem('dec2.boot-recover')) return; sessionStorage.setItem('dec2.boot-recover', '1'); } catch (e) { return; }
      var done = function () { location.reload(); };
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null
      ]).then(done, done);
    }, 8000);
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
